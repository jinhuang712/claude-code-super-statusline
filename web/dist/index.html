    <script>
      // Resolve the panel scheme before first paint (same rules as src/theme.ts) so light-mode
      // users never see a dark flash. Storage can be blocked; the system preference still applies.
      (function () {

        try {
          pref = localStorage.getItem("ssp.theme") || "system";
        } catch (e) {}
        var light = pref === "light" || (pref !== "dark" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>
